description: Souqalmal was a UAE-based personal-finance comparison marketplace that let
  consumers across the GCC compare and apply for credit cards, personal loans, bank accounts,
  and insurance products online. The brand has since transitioned to Yabi (yabimoney.com),
  an AI-powered financial coaching application offering personalized guidance, budgeting
  tools, spending tracking, credit checks, and financial-education content on iOS and
  Android. Backed by 500 Global. The souqalmal.com domain now permanently redirects to
  yabimoney.com. No public developer, API, or partner-integration surface is currently
  published.
